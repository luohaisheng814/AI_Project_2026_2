<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<title>Busan AI 旅行助手</title>
<link rel="manifest" href="/manifest.json">
<style>
  :root{
    --navy:#0b1622; --navy2:#122536; --ocean:#0891b2; --ocean-l:#22d3ee;
    --sand:#f3efe7; --ink:#0f1b26; --muted:#64748b; --line:#e2e8f0;
    --ok:#0f9d76; --warn:#c2740c; --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",
    "PingFang SC","Microsoft YaHei",sans-serif;background:#eef2f6;color:var(--ink);
    display:flex;flex-direction:column;min-height:100vh;
  }
  header{
    background:linear-gradient(150deg,#0b1622 0%,#122536 55%,#0e3a45 100%);
    color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;
    position:sticky;top:0;z-index:20;box-shadow:0 6px 18px rgba(8,20,32,.18);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    width:34px;height:34px;border-radius:10px;background:rgba(34,211,238,.16);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#67e8f9;
    border:1px solid rgba(103,232,249,.35);font-size:15px
  }
  .brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.4px}
  .brand p{margin:2px 0 0;font-size:11px;color:#9fb3c8}
  .head-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .langs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:3px;border-radius:999px}
  .lang-btn{
    border:0;background:transparent;color:#c9d7e3;font-size:12px;padding:5px 10px;
    border-radius:999px;font-weight:600
  }
  .lang-btn.on{background:#22d3ee;color:#062733}
  .spacer{flex:1}
  .auth-btn{
    border:1px solid rgba(103,232,249,.5);background:rgba(34,211,238,.12);color:#a5f3fc;
    font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;
  }
  .auth-btn.out{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#e6eef5}
  .who{font-size:11.5px;color:#9fb3c8;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;
    padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#cfe0ea
  }
  .dot{width:6px;height:6px;border-radius:50%;background:#f59e0b}
  .dot.on{background:#34d399}

  .gear{
    border:0;background:transparent;color:#9fb3c8;font-size:15px;padding:2px 4px;line-height:1
  }

  /* 四步流程条：位置 → 条件 → 候选 → 路线 */
  .flowbar{
    display:flex;align-items:center;gap:4px;padding:8px 12px;background:#fff;
    border-bottom:1px solid var(--line);overflow-x:auto
  }
  .fstep{
    flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:11px;color:#8ba1ad;
    padding:4px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap
  }
  .fstep i{
    width:15px;height:15px;border-radius:50%;background:#e8eef2;color:#7b93a0;
    font-style:normal;font-size:9.5px;display:flex;align-items:center;justify-content:center;font-weight:700
  }
  .fstep.on{background:#e6f7fb;border-color:#bfe6ef;color:#0b5c73}
  .fstep.on i{background:#0891b2;color:#fff}
  .fstep.done i{background:#0f9d76;color:#fff}
  .fstep.done{color:#3f6a5c}
  .farrow{color:#c3d3da;font-size:11px;flex:0 0 auto}

  .controls{
    display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10
  }
  .controls label{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .controls span{font-size:10.5px;color:var(--muted);letter-spacing:.3px}
  select{
    appearance:none;width:100%;border:1px solid var(--line);background:#f8fafc;color:var(--ink);
    font-size:12.5px;padding:8px 10px;border-radius:10px
  }

  main{flex:1;padding:12px 12px calc(112px + env(safe-area-inset-bottom));overflow-y:auto}
  .welcome{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;
    box-shadow:0 4px 14px rgba(15,27,38,.05)
  }
  .welcome h2{margin:0 0 6px;font-size:14px}
  .welcome p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .chip{
    border:1px solid #d9e4ec;background:#f6fafc;color:#0f4b5c;font-size:12px;
    padding:7px 11px;border-radius:999px
  }
  .turn{margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .q{align-self:flex-end;max-width:86%;background:linear-gradient(135deg,#0e7490,#0891b2);
     color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:13px;line-height:1.5}
  .a{align-self:flex-start;max-width:96%;background:var(--card);border:1px solid var(--line);
     border-radius:14px 14px 14px 4px;padding:12px 13px;font-size:13px;line-height:1.65;
     box-shadow:0 3px 12px rgba(15,27,38,.05);word-break:break-word}
  .meta-line{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:999px;background:#eef4f8;color:#41627a}
  .tag.online{background:#e4f7f1;color:var(--ok)}
  .tag.local{background:#fdf3e3;color:var(--warn)}
  .tag.concise{background:#e8f1fb;color:#28618f}
  .answer h3{font-size:13.5px;margin:10px 0 4px;color:#0c3c4c}
  .answer p{margin:5px 0}
  .answer li{margin:3px 0}
  .answer strong{color:#0b3b47}
  .answer hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
  .src-block{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;font-size:11.5px;color:var(--muted)}
  .src-block b{display:block;color:#41627a;font-size:11.5px;margin-bottom:4px}
  .src-line{display:flex;gap:6px;margin:3px 0;word-break:break-all}
  .src-line .k{color:#0e7490;flex:0 0 auto}
  .src-line .v{color:#475569}
  .sup{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px}
  .sup b{display:block;font-size:12px;color:#0c3c4c;margin-bottom:5px}
  .sup-item{margin:4px 0;color:#334155}
  .sup-item i{font-style:normal;color:var(--muted);font-size:11px}
  .fu{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .fu button{border:1px solid #cfe3ec;background:#f4fbfd;color:#0b5266;font-size:11.5px;
    padding:5px 9px;border-radius:10px}
  .thinking{color:var(--muted);font-size:12px}

  .nearby{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
  .nearby h3{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:6px}
  .nearby .hint{margin:0 0 9px;font-size:11px;color:var(--muted)}
  .spot{border-top:1px solid var(--line);padding:9px 0}
  .spot.rec{border:1px solid #cbe9f2;border-radius:12px;padding:10px 11px;margin:8px 0;background:#f7fcfd}
  .rec-badge{font-size:10px;font-weight:700;color:#fff;background:#0891b2;padding:2px 7px;border-radius:999px}
  .spot-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .spot-name{font-size:12.5px;font-weight:700}
  .dist{font-size:11.5px;color:var(--ocean);font-weight:700;flex:0 0 auto}
  .spot-ko{font-size:11px;color:var(--muted);margin-top:1px}
  .reason{font-size:11.5px;color:#41627a;margin-top:4px;line-height:1.5}
  .map-row{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .map-btn{
    font-size:11.5px;text-decoration:none;padding:6px 10px;border-radius:9px;font-weight:700;
    border:1px solid #cfe3ec;color:#0b5266;background:#f4fbfd
  }
  .map-btn.naver{background:#03c75a;border-color:#03c75a;color:#fff}
  .map-btn.g{background:#fff;border-color:#d8dee6;color:#334155}
  .more-btn{
    display:block;width:100%;margin-top:8px;border:1px dashed #cfe3ec;background:#fafdfe;
    color:#0b5266;font-size:11.5px;font-weight:600;padding:8px;border-radius:10px
  }

  .locfail{margin-top:14px;background:#fff8ec;border:1px solid #efd6a8;border-radius:16px;padding:13px 14px}
  .locfail h3{margin:0 0 4px;font-size:13px;color:#8a5a12}
  .locfail p{margin:0 0 9px;font-size:11.5px;line-height:1.55;color:#7a5a24}
  .locfail .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .locfail button{
    border:1px solid #e3c78f;background:#fff;color:#8a5a12;font-size:11.5px;font-weight:700;
    padding:7px 11px;border-radius:9px
  }
  .locfail select{
    flex:1;min-width:140px;font-size:11.5px;padding:7px 9px;border-radius:9px;border:1px solid #e3c78f;background:#fff
  }

  .trace{
    display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:9px 0 2px;
    font-size:10.5px;color:#7b93a0
  }
  .trace b{color:#41627a;font-weight:600}
  .trace .sep{color:#c3d3da}

  .composer{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);
    border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px)
  }
  .tools{display:flex;gap:6px;margin-bottom:7px;overflow-x:auto}
  .tool{
    flex:0 0 auto;border:1px solid var(--line);background:#f6fafc;color:#0f4b5c;
    font-size:11.5px;padding:6px 10px;border-radius:9px;font-weight:600
  }
  .input-row{display:flex;gap:8px}
  textarea{
    flex:1;resize:none;height:42px;max-height:96px;border:1px solid var(--line);border-radius:12px;
    padding:10px 11px;font-size:13px;font-family:inherit;line-height:1.4;background:#f8fafc
  }
  .send{
    width:66px;border:0;border-radius:12px;background:linear-gradient(135deg,#0e7490,#0891b2);
    color:#fff;font-size:13px;font-weight:700
  }

  .mask{
    position:fixed;inset:0;background:rgba(8,20,32,.55);z-index:40;display:none;
    align-items:flex-end;justify-content:center;padding:0
  }
  .mask.show{display:flex}
  .sheet{
    width:100%;max-width:460px;background:#fff;border-radius:18px 18px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(8,20,32,.25)
  }
  .sheet h3{margin:0 0 4px;font-size:15px}
  .sheet p{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.55}
  .field{margin-bottom:9px}
  .field span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  .field input{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;
    font-size:13px;background:#f8fafc
  }
  .sheet-error{color:#b42318;font-size:11.5px;min-height:16px;margin:2px 0 6px}
  .sheet-actions{display:flex;gap:8px;margin-top:6px}
  .btn-ghost{flex:1;border:1px solid var(--line);background:#f8fafc;border-radius:11px;
    padding:11px;font-size:13px;font-weight:600;color:#41586b}
  .btn-main{flex:1.2;border:0;border-radius:11px;padding:11px;font-size:13px;font-weight:700;
    color:#fff;background:linear-gradient(135deg,#0e7490,#0891b2)}
  .btn-link{
    display:block;width:100%;margin-top:10px;border:0;background:transparent;color:#0e7490;
    font-size:12px;font-weight:600;text-decoration:underline
  }
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));
    background:rgba(11,22,34,.92);color:#fff;font-size:12px;padding:9px 14px;border-radius:10px;
    z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">B</div>
    <div>
      <h1 id="appTitle">釜山 AI 旅行助手</h1>
      <p id="appSub">沙下区 · 景点官网 + 本地数据库</p>
    </div>
  </div>
  <div class="head-row">
    <div class="langs">
      <button class="lang-btn" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <div class="spacer"></div>
    <span class="status"><i class="dot" id="statusDot"></i><span id="statusText">本地模式</span></span>
    <button class="auth-btn" id="authBtn">登录</button>
    <button class="gear" id="srvBtn" style="display:none" title="服务器">⚙</button>
  </div>
  <div class="who" id="whoLine"></div>
</header>

<div class="flowbar" id="flowbar">
  <div class="fstep" data-step="1"><i>1</i><b id="fLoc">位置</b></div>
  <span class="farrow">›</span>
  <div class="fstep" data-step="2"><i>2</i><b id="fCond">条件</b></div>
  <span class="farrow">›</span>
  <div class="fstep" data-step="3"><i>3</i><b id="fCand">候选</b></div>
  <span class="farrow">›</span>
  <div class="fstep" data-step="4"><i>4</i><b id="fRoute">路线</b></div>
</div>

<div class="controls">
  <label><span id="lblCat">玩法</span><select id="catSel"></select></label>
  <label><span id="lblGroup">出行人数</span><select id="grpSel"></select></label>
</div>

<main id="main">
  <section class="welcome" id="welcome">
    <h2 id="welcomeTitle">你好，我是釜山旅行助手</h2>
    <p id="welcomeBody">问景点、交通、门票、开放时间都可以。登录后我会同时检索各景点官方网站与本地数据库。</p>
    <div class="chips" id="chips"></div>
  </section>
  <div id="turns"></div>
</main>

<div class="composer">
  <div class="tools">
    <button class="tool" id="gpsBtn">附近景点</button>
    <button class="tool" id="pkgBtn">安装包</button>
    <button class="tool" id="installBtn">添加到主屏幕</button>
    <button class="tool" id="clearBtn">清空</button>
  </div>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="问点什么…"></textarea>
    <button class="send" id="sendBtn">发送</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="sheet">
    <h3 id="loginTitle">登录账号</h3>
    <p id="loginDesc">登录后开启联网：AI 会同时引用各景点官方网站与本地数据库。</p>
    <div class="field"><span id="lblUser">用户名</span><input id="uName" autocomplete="username"></div>
    <div class="field"><span id="lblPwd">密码</span><input id="uPwd" type="password" autocomplete="current-password"></div>
    <div class="sheet-error" id="errLine"></div>
    <div class="sheet-actions">
      <button class="btn-ghost" id="cancelBtn">取消</button>
      <button class="btn-main" id="doLogin">登录</button>
    </div>
    <button class="btn-link" id="doRegister">注册新账号（与电脑端共用同一账号）</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const UI_STR = {

    trIn:"输入", trRet:"检索", trAns:"回答", trSrc:"来源", trRoute:"路线",
    srv:"服务器", srvNow:"当前服务地址", srvChange:"更换", srvCancel:"返回",
    chipExisting:"我要去甘川文化村", chipRecommend:"推荐附近一个地方", chipModify:"时间不够，少走路"
  },
  ko: {

    login:"로그인", logout:"로그아웃", who:"", local:"로컬 모드", online:"온라인",
    lblCat:"테마", lblGroup:"인원",
    welcomeTitle:"안녕하세요, 부산 여행 도우미입니다",
    welcomeBody:"명소, 교통, 요금, 개방 시간 무엇이든 물어보세요. 로그인하면 명소 공식 홈페이지와 로컬 DB를 함께 조회합니다.",
    placeholder:"무엇이든 물어보세요…", send:"전송",
    gps:"주변 명소", pkg:"설치 패키지", install:"홈 화면에 추가", clear:"지우기",
    loginTitle:"로그인", loginDesc:"로그인하면 온라인 모드가 켜집니다: 명소 공식 홈페이지 + 로컬 DB를 함께 사용합니다.",

/* 四步流程条：1 位置 → 2 条件 → 3 候选 → 4 路线 */
function setFlow(step){
  S.step = Math.max(S.step, step || 0);
  document.querySelectorAll(".fstep").forEach(el => {
    const n = parseInt(el.dataset.step, 10);
    el.classList.toggle("on", n === step);
    el.classList.toggle("done", n < step || (n < S.step && n !== step));
  });
}

/* ---------------- 轻量 Markdown ---------------- */
function esc(s){ return (s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function stripTail(t, data){
  // LLM 草稿末尾自带「补充推荐 / 资料来源」清单，前端已用结构化块单独渲染，这里去掉避免重复。
  // 标题可能带 ### / ** / 空格 / 冒号，统一放宽匹配。
  let s = t || "";
  if ((data.supplements || []).length){
    s = s.replace(/\n+[-–—\s#*>]*\**\s*(其它玩法补充推荐|其他玩法补充推荐|其他推荐|Other[ -]theme[^\n]*|다른 테마[^\n]*)[\s\S]*$/i, "");
  }
  s = s.replace(/\n+[-–—\s#*>]*\**\s*(资料来源|数据来源|信息来源|Sources|출처)[\s\S]*$/i, "");
  s = s.replace(/\n+[-–—\s]*\**\s*(登录后开启联网检索|Log in to enable[^\n]*|로그인하면[^\n]*)[\s\S]*$/i, "");
  return s.replace(/\n+[-–—\s]*$/g, "").trim();
}

function mdLite(text){
  let out = esc(text || "");
  out = out.replace(/^###\s+(.*)$/gm, "<h3>$1</h3>");
  out = out.replace(/^##\s+(.*)$/gm, "<h3>$1</h3>");
  out = out.replace(/^#\s+(.*)$/gm, "<h3>$1</h3>");
  out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/^\s*(?:-|•)\s+(.*)$/gm, "<li>$1</li>");
  out = out.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>");
  out = out.replace(/^\s*---+\s*$/gm, "<hr>");
  out = out.replace(/\n{2,}/g, "</p><p>").replace(/\n/g, "<br>");
  return "<p>" + out + "</p>";
}

/* ---------------- 问答 ---------------- */
function clearTurns(){ $("turns").innerHTML = ""; }

function renderTurn(q, data){
  const wrap = document.createElement("div"); wrap.className = "turn";
  const qb = document.createElement("div"); qb.className = "q"; qb.textContent = q;
  wrap.appendChild(qb);

  const ab = document.createElement("div"); ab.className = "a";
  const tags = [];
  tags.push(`<span class="tag ${data.online ? "online" : "local"}">${data.online ? T("tagOnline") : T("tagLocal")}</span>`);
  if (data.concise) tags.push(`<span class="tag concise">${T("tagConcise")}</span>`);
  if (data.web_count) tags.push(`<span class="tag">${T("tagWeb").replace("%n", data.web_count)}</span>`);
  if (data.spot) tags.push(`<span class="tag">${esc(data.spot)}</span>`);
  const meta = `<div class="meta-line">${tags.join("")}</div>`;

  let body = `<div class="answer">${mdLite(stripTail(data.answer || "", data))}</div>`;

  const srcs = (data.sources || []).filter(s => s.detail);  let srcHtml = "";
  if (srcs.length){
    srcHtml = `<div class="src-block"><b>${T("src")}</b>` + srcs.map(s => {
      const v = /^https?:/.test(s.detail)
        ? `<a href="${esc(s.detail)}" target="_blank" rel="noopener">${esc(s.detail)}</a>`
        : esc(s.detail);
      return `<div class="src-line"><span class="k">${esc(s.label || "")}</span><span class="v">${v}</span></div>`;
    }).join("") + `</div>`;
  }

  const sups = data.supplements || [];
  let supHtml = "";  if (sups.length){
    supHtml = `<div class="sup"><b>${T("sup")}</b>` + sups.map(s =>
      `<div class="sup-item">${esc(s.name)} <i>· ${esc(s.cat_label || s.category || "")} · ${esc(s.reason || "")}</i></div>`
    ).join("") + `</div>`;
  }

  let fuHtml = "";
  if ((data.followups || []).length){
    fuHtml = `<div class="fu"><b style="font-size:11.5px;color:#41627a">${T("fu")}</b>` +
      data.followups.map(f => `<button data-q="${esc(f)}">${esc(f)}</button>`).join("") + `</div>`;
  }

  // 一轮问答的可核对轨迹：输入 → 检索（本地/联网） → 回答 → 来源
  const webN = data.web_count ? ` + ${T("tagWeb").replace("%n", data.web_count)}` : "";
  const trace = `<div class="trace"><b>${T("trIn")}</b><span class="sep">›</span>` +
    `<b>${T("trRet")}</b> ${data.online ? T("tagOnline") : T("tagLocal")}${webN}` +
    `<span class="sep">›</span><b>${T("trAns")}</b><span class="sep">›</span>` +
    `<b>${T("trSrc")}</b> ${srcs.length}</div>`;

  ab.innerHTML = meta + trace + body + srcHtml + supHtml + fuHtml;
  ab.querySelectorAll(".fu button").forEach(b => b.onclick = () => ask(b.dataset.q));
  wrap.appendChild(ab);
  $("turns").appendChild(wrap);
  if (data.spot) setFlow(3);
}

async function ask(q){
  q = (q || "").trim();
  if (!q){ toast(T("emptyQ")); return; }
  S.lastQ = q;
  $("input").value = "";

  const wrap = document.createElement("div"); wrap.className = "turn";
  const qb = document.createElement("div"); qb.className = "q"; qb.textContent = q;
  const ab = document.createElement("div"); ab.className = "a thinking"; ab.textContent = T("thinking");
  wrap.appendChild(qb); wrap.appendChild(ab); $("turns").appendChild(wrap);
  wrap.scrollIntoView({behavior:"smooth", block:"end"});

  try{
    const r = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({question:q, category:$("catSel").value, group_type:$("grpSel").value, ui_lang:S.lang})
    });
    const m = await r.json();
    if (m.category) $("catSel").value = m.category;
    if (m.group_type) $("grpSel").value = m.group_type;
    if (m.online !== undefined){ S.logged = !!m.online; }
    wrap.remove();
    renderTurn(q, m);
    renderAuth();
    const el = $("turns").lastElementChild;
    if (el) el.scrollIntoView({behavior:"smooth", block:"end"});
  }catch(e){
    ab.classList.remove("thinking");
    ab.textContent = "网络异常，请重试 / 네트워크 오류 / Network error";
  }
}

function regenerateAll(){
  const last = S.lastQ; clearTurns();
  if (last) ask(last);
}

/* ---------------- 附近景点 + NAVER 深链 ---------------- */
function reasonText(s){
  return T(REASON_KEY[s.cat] || "rArt") + " · " + s.distance_km + " km";
}

function spotCard(s, isRec){
  const row = document.createElement("div");
  row.className = "spot" + (isRec ? " rec" : "");
  row.innerHTML = `
    <div class="spot-top">
      <div><div class="spot-name">${isRec ? '<span class="rec-badge">' + T("rec") + '</span> ' : ""}${esc(s.name)}</div>
        <div class="spot-ko">${esc(s.ko)}</div></div>
      <div class="dist">${s.distance_km} km</div>
    </div>
    <div class="reason">${esc(reasonText(s))}</div>
    <div class="map-row">
      <a class="map-btn naver" data-route="1" href="${esc(s.naver_route_url || s.naver_url)}">${T("nav")}</a>
      <a class="map-btn" href="${esc(s.naver_place_url || s.naver_url)}">${T("place")}</a>
      <a class="map-btn" href="${esc(s.naver_web_url || '')}" target="_blank" rel="noopener">${T("web")}</a>
      <a class="map-btn g" href="${esc(s.google_url)}" target="_blank" rel="noopener">${T("g")}</a>
    </div>`;
  const route = row.querySelector('[data-route="1"]');
  if (route) route.addEventListener("click", () => setFlow(4));
  return row;
}

function renderNearby(spots, lat, lng, keep, originName){
  S.spots = spots; S.nearLat = lat; S.nearLng = lng;
  S.nearName = originName || (S.lang === "ko" ? "현위치(GPS)" : (S.lang === "en" ? "Current location (GPS)" : "当前位置（GPS）"));
  if (!keep) clearTurns();
  else {
    const old = document.querySelectorAll(".nearby, .locfail");
    old.forEach(el => el.remove());
  }

  const sec = document.createElement("section"); sec.className = "nearby";
  const head = `<h3>${T("near")}<span class="dist" style="font-weight:500;color:#64748b">${esc(S.nearName)}</span></h3>
                <p class="hint">${T("nearTop")} · ${T("nearHint")}</p>`;
  sec.innerHTML = head;

  spots.slice(0, 2).forEach(s => sec.appendChild(spotCard(s, true)));
  if (spots.length > 2){
    const btn = document.createElement("button");
    btn.className = "more-btn";
    btn.textContent = T("nearRest").replace("%n", spots.length - 2);
    btn.onclick = () => {
      btn.remove();
      spots.slice(2).forEach(s => sec.appendChild(spotCard(s, false)));
      setFlow(3);
    };
    sec.appendChild(btn);
  }
  $("turns").appendChild(sec);
  setFlow(3);
  sec.scrollIntoView({behavior:"smooth", block:"start"});
}

/* 定位失败：仍把流程显示出来，允许重试或手动选出发点 */
function renderLocFail(){
  const old = document.querySelectorAll(".nearby, .locfail");
  old.forEach(el => el.remove());
  const sec = document.createElement("section"); sec.className = "locfail";
  sec.innerHTML = `<h3>${T("locFailTitle")}</h3><p>${T("locFailBody")}</p>
    <div class="row">
      <button id="retryLoc">${T("retryLoc")}</button>
      <select id="originSel"><option value="">${T("originPh")}</option></select>
    </div>`;
  const sel = sec.querySelector("#originSel");
  (S.meta.spots || []).forEach((sp, i) => {
    const o = document.createElement("option");
    o.value = String(i); o.textContent = sp.name + " · " + sp.ko;
    sel.appendChild(o);
  });
  sel.onchange = () => {
    const sp = (S.meta.spots || [])[Number(sel.value)];
    if (!sp) return;
    toast(sp.name);
    nearbyAt(sp.lat, sp.lng, false, sp.name);
  };
  sec.querySelector("#retryLoc").onclick = locateAndNearby;
  $("turns").appendChild(sec);
  setFlow(1);
  sec.scrollIntoView({behavior:"smooth", block:"start"});
}

async function nearbyAt(lat, lng, keep, originName){
  setFlow(2);
  try{
    const r = await fetch("/api/nearby", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({lat, lng, origin_name: originName || ""})
    });
    const m = await r.json();
    renderNearby(m.spots || [], lat, lng, !!keep, originName || m.origin_name || "");
  }catch(e){ toast(T("locateFail")); }
}

function locateAndNearby(){
  setFlow(1);
  if (!navigator.geolocation){ renderLocFail(); return; }
  toast(T("locate"));
  const run = () => navigator.geolocation.getCurrentPosition(
    pos => nearbyAt(pos.coords.latitude, pos.coords.longitude),
    () => renderLocFail(),
    {enableHighAccuracy:true, timeout:8000, maximumAge:60000}
  );
  // 安装包里先走 Android 运行时授权，授权结果由壳回调 __busanLocReady
  if (window.BusanHost && window.BusanHost.requestLocation){
    window.__busanLocReady = function(){ delete window.__busanLocReady; run(); };
    try { window.BusanHost.requestLocation(); } catch(e){ run(); }
    return;
  }
  run();
}

/* ---------------- 事件绑定 ---------------- */
document.querySelectorAll(".lang-btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".lang-btn").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    setLang(b.dataset.lang);
  };
});
$("authBtn").onclick = () => { if (S.logged) doLogout(); else openLogin(); };
$("cancelBtn").onclick = closeLogin;
$("doLogin").onclick = doLogin;
$("doRegister").onclick = doRegister;
$("mask").onclick = e => { if (e.target === $("mask")) closeLogin(); };
$("uPwd").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

$("sendBtn").onclick = () => ask($("input").value);
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask($("input").value); }
});
$("gpsBtn").onclick = locateAndNearby;
$("clearBtn").onclick = () => { clearTurns(); S.lastQ = ""; };
$("pkgBtn").onclick = () => { location.href = "/download/Busan_Tour_App.zip"; };
$("installBtn").onclick = async () => {
  if (window.deferredPrompt){ window.deferredPrompt.prompt(); window.deferredPrompt = null; }
  else { toast("浏览器菜单 → 添加到主屏幕 / 브라우저 메뉴 → 홈 화면에 추가 / Browser menu → Add to Home Screen"); }
};
$("catSel").onchange = e => { S.cat = e.target.value; localStorage.setItem("busan-cat", S.cat); if (S.lastQ) regenerateAll(); };
$("grpSel").onchange = e => { S.grp = e.target.value; localStorage.setItem("busan-grp", S.grp); if (S.lastQ) regenerateAll(); };

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.deferredPrompt = e; });

(async function init(){
  document.querySelectorAll(".lang-btn").forEach(b => {
    if (b.dataset.lang === S.lang) b.classList.add("on");
  });
  // APK 里才会注入 BusanHost：给出「更换服务器地址」入口
  if (window.BusanHost && window.BusanHost.resetServer){
    $("srvBtn").style.display = "inline-block";
    $("srvBtn").title = T("srv");
    $("srvBtn").onclick = () => window.BusanHost.resetServer();
  }
  await checkMe();
  await loadMeta();
  applyLangUI();
  setFlow(0);
  if ("serviceWorker" in navigator){ navigator.serviceWorker.register("/sw.js").catch(() => {}); }
  // 调试/分享入口：?lat=35.09&lng=128.97 可直接按坐标展示附近景点（无需浏览器定位权限）
  const qp = new URLSearchParams(location.search);
  if (qp.get("lat") && qp.get("lng")){
    nearbyAt(parseFloat(qp.get("lat")), parseFloat(qp.get("lng")));
  }
})();
</script>
</body>
</html>
