<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Busan Tour">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Busan AI 旅行助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #0f172a; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    color: #fff; padding: 14px 16px 12px; flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header .sub { font-size: 12px; color: #7dd3fc; margin-top: 2px; }

  /* 玩法 / 人数选择栏 */
  #scopeBar { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
  .scope-pick { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .scope-pick label { font-size: 11px; color: #64748b; }
  .scope-pick select {
    padding: 9px 8px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px;
    background: #f8fafc; color: #0f172a; outline: none; max-width: 100%;
  }

  #toolbar { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; flex-wrap: wrap; }
  #langBar { display: flex; gap: 4px; background: #f1f5f9; border-radius: 10px; padding: 3px; }
  .lang-btn { padding: 8px 10px; border: none; border-radius: 8px; font-size: 12px; background: transparent; color: #475569; }
  .lang-btn.active { background: #1e3a8a; color: #fff; font-weight: 600; }
  #gpsBtn {
    flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: #0ea5e9; color: #fff;
  }
  #gpsBtn:active { background: #0284c7; }
  #gpsBtn.busy { background: #94a3b8; }
  #installBtn {
    padding: 12px 14px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: #1e3a8a; color: #fff; display: none;
  }
  #installBtn.show { display: inline-block; }
  #pkgBtn {
    padding: 12px 14px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: #059669; color: #fff; text-decoration: none; text-align: center;
  }

  #locStatus { font-size: 11px; color: #64748b; padding: 6px 12px 0; background: #fff; flex-shrink: 0; display: none; }

  #nearby { padding: 10px 12px 0; display: none; flex-shrink: 0; max-height: 40vh; overflow-y: auto; }
  #nearby h3 { font-size: 13px; color: #475569; margin-bottom: 8px; }
  .nearby-card {
    background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    border: 1px solid #e2e8f0;
  }
  .nearby-card .row1 { display: flex; justify-content: space-between; align-items: center; }
  .nearby-card .name { font-size: 14px; font-weight: 600; }
  .nearby-card .ko { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .nearby-card .cat { display: inline-block; font-size: 10px; color: #0ea5e9; background: #e0f2fe; border-radius: 6px; padding: 2px 6px; margin-top: 4px; }
  .nearby-card .dist { font-size: 13px; color: #0ea5e9; font-weight: 700; }
  .nearby-card .row2 { display: flex; gap: 8px; margin-top: 8px; }
  .nearby-card .row2 a {
    flex: 1; text-align: center; font-size: 12px; padding: 6px 0; border-radius: 8px;
    text-decoration: none; color: #fff;
  }
  .nav-naver { background: #03c75a; }
  .nav-chat { background: #1e3a8a; }
  .nav-gmap { background: #475569; }

  #chat { flex: 1; overflow-y: auto; padding: 14px 12px; }
  .msg { margin-bottom: 12px; max-width: 88%; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { margin-left: auto; background: #0ea5e9; color: #fff; padding: 10px 12px; border-radius: 14px 14px 4px 14px; }
  .msg.bot { background: #fff; border: 1px solid #e2e8f0; padding: 10px 12px; border-radius: 14px 14px 14px 4px; }
  .msg .meta { font-size: 11px; color: #94a3b8; margin-top: 6px; }
  .msg.bot b { color: #1e3a8a; }
  .follow { cursor: pointer; }

  /* 跨类补充推荐卡片：排在主推荐之后，单独成段 */
  .supp-box { margin-top: 10px; border-top: 1px dashed #cbd5e1; padding-top: 8px; }
  .supp-box .supp-title { font-size: 12px; font-weight: 700; color: #059669; margin-bottom: 6px; }
  .supp-item { font-size: 12.5px; color: #334155; margin-bottom: 6px; line-height: 1.5; }
  .supp-item .tag { display: inline-block; font-size: 10px; color: #059669; background: #ecfdf5; border-radius: 6px; padding: 1px 6px; margin-right: 4px; }

  #inputBar { display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-top: 1px solid #e2e8f0; flex-shrink: 0; }
  #qInput { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; }
  #qInput:focus { border-color: #0ea5e9; }
  #sendBtn { padding: 0 18px; border: none; border-radius: 10px; background: #1e3a8a; color: #fff; font-size: 15px; font-weight: 600; }
  #sendBtn:active { background: #1e40af; }
  #sendBtn:disabled { background: #94a3b8; }
</style>
</head>
<body>
  <header>
    <h1>🚗 Busan AI 旅行助手</h1>
    <div class="sub">沙下区手机版 · 玩法/人数联动 · GPS 附近景点 · 可安装到桌面</div>
  </header>

  <div id="scopeBar">
    <div class="scope-pick">
      <label for="catSel">玩法分类（可手动改）</label>
      <select id="catSel"><option value="">自动识别 / 全部</option></select>
    </div>
    <div class="scope-pick">
      <label for="grpSel">出行人数（可手动改）</label>
      <select id="grpSel"><option value="">自动识别 / 默认</option></select>
    </div>
  </div>

  <div id="toolbar">
    <div id="langBar">
      <button class="lang-btn" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="en">English</button>
    </div>
    <button id="gpsBtn">📍 定位附近景点</button>
    <button id="installBtn">⤓ 安装到桌面</button>
    <a id="pkgBtn" href="/download/Busan_Tour_App.zip" download>⤓ 下载安装包</a>
  </div>
  <div id="locStatus"></div>

  <div id="nearby">
    <h3>附近景点（按距离排序）</h3>
    <div id="nearbyList"></div>
  </div>

  <div id="chat">
    <div class="msg bot" id="welcomeMsg"></div>
  </div>

  <div id="inputBar">
    <input id="qInput" type="text" placeholder="问：没云台怎么去？" autocomplete="off">
    <button id="sendBtn">发送</button>
  </div>

<script>
const chat = document.getElementById('chat');
const qInput = document.getElementById('qInput');
const sendBtn = document.getElementById('sendBtn');
const gpsBtn = document.getElementById('gpsBtn');
const installBtn = document.getElementById('installBtn');
const pkgBtn = document.getElementById('pkgBtn');
const nearbyBox = document.getElementById('nearby');
const nearbyList = document.getElementById('nearbyList');
const locStatus = document.getElementById('locStatus');
const catSel = document.getElementById('catSel');
const grpSel = document.getElementById('grpSel');
const langBtns = document.querySelectorAll('.lang-btn');
const welcomeMsg = document.getElementById('welcomeMsg');

let lastLat = null, lastLng = null;

// ---- 界面语言状态（决定回答语言，与提问语言无关）----
let uiLang = localStorage.getItem('busan-lang') || 'zh';
const UI_STR = {
  zh: {
    welcome: '你好！我是釜山沙下区 AI 旅行助手。选择玩法与人数（也可直接提问，系统会自动识别联动），或点上方「定位附近景点」。回答语言以顶部按钮为准。',
    placeholder: '问：没云台怎么去？',
    send: '发送', gps: '📍 定位附近景点', install: '⤓ 安装到桌面', pkg: '⤓ 下载安装包',
    theme: '玩法分类（可手动改）', group: '出行人数（可手动改）',
    nearbyTitle: '附近景点（按距离排序）', recognize: '识别：',
    suppTitle: n => '其它玩法补充推荐（排在主推荐之后，限量 ' + n + ' 个）',
    askIntro: '介绍一下',
  },
  ko: {
    welcome: '안녕하세요! 부산 사하구 AI 여행 도우미입니다. 테마와 인원 수를 선택하거나 바로 질문해 주세요(자동으로 연동됩니다). 답변 언어는 상단 언어 버튼을 따릅니다.',
    placeholder: '예: 몰운대 어떻게 가나요?',
    send: '전송', gps: '📍 위치 기반 명소', install: '⤓ 홈 화면에 설치', pkg: '⤓ 설치 패키지 다운로드',
    theme: '테마 분류(직접 변경 가능)', group: '인원 수(직접 변경 가능)',
    nearbyTitle: '가까운 명소(거리 순)', recognize: '인식: ',
    suppTitle: n => '다른 테마 추천(주 추천 이후, 최대 ' + n + '개)',
    askIntro: '소개해 주세요',
  },
  en: {
    welcome: 'Hi! I am the Busan Saha-gu AI travel assistant. Pick a theme and group size, or just ask a question (auto-linked). The reply language follows the top language button.',
    placeholder: 'Ask: How do I get to Molundae?',
    send: 'Send', gps: '📍 Nearby spots', install: '⤓ Install', pkg: '⤓ Download package',
    theme: 'Theme (editable)', group: 'Group size (editable)',
    nearbyTitle: 'Nearby spots (by distance)', recognize: 'Detected: ',
    suppTitle: n => 'Other-theme picks (after main, max ' + n + ')',
    askIntro: 'Tell me about it',
  }
};
const ui = () => UI_STR[uiLang] || UI_STR.zh;

function applyLangUI() {
  langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === uiLang));
  welcomeMsg.textContent = ui().welcome;
  qInput.placeholder = ui().placeholder;
  sendBtn.textContent = ui().send;
  gpsBtn.textContent = ui().gps;
  installBtn.textContent = ui().install;
  pkgBtn.textContent = ui().pkg;
  catSel.previousElementSibling.textContent = ui().theme;
  grpSel.previousElementSibling.textContent = ui().group;
  document.querySelector('#nearby h3').textContent = ui().nearbyTitle;
  document.documentElement.lang = uiLang === 'zh' ? 'zh-CN' : uiLang;
}

// 历史提问：切换语言后逐条重新生成（不回放旧语言文本）
const historyQ = [];
let regenerating = false;

// ---- 初始化玩法 / 人数选项 ----
async function loadMeta() {
  try {
    const r = await fetch('/api/meta');
    const data = await r.json();
    (data.categories || []).forEach(c => {
      const o = document.createElement('option'); o.value = c.key; o.textContent = c.label; catSel.appendChild(o);
    });
    (data.groups || []).forEach(g => {
      const o = document.createElement('option'); o.value = g.key; o.textContent = g.label; grpSel.appendChild(o);
    });
  } catch (e) { console.warn('meta 加载失败', e); }
}
loadMeta();

// ---- PWA：Service Worker 注册 + 安装到主屏幕 ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW 注册失败', e));
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.add('show');
});
installBtn.onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.classList.remove('show');
};
window.addEventListener('appinstalled', () => installBtn.classList.remove('show'));

function setLoc(text) {
  locStatus.textContent = text || '';
  locStatus.style.display = text ? 'block' : 'none';
}

function addMsg(text, who, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// 渲染跨类补充推荐（主推荐之后，限量、标注玩法与理由）
function renderSupplements(container, supplements) {
  if (!supplements || !supplements.length) return;
  const box = document.createElement('div');
  box.className = 'supp-box';
  const title = document.createElement('div');
  title.className = 'supp-title';
  title.textContent = ui().suppTitle(supplements.length);
  box.appendChild(title);
  supplements.forEach(s => {
    const item = document.createElement('div');
    item.className = 'supp-item';
    item.innerHTML = `<span class="tag">${s.cat_label || s.category || ''}</span><b>${s.name}</b>：${s.reason || ''}`;
    box.appendChild(item);
  });
  container.appendChild(box);
}

async function ask(question, opts = {}) {
  const { push = true } = opts;
  if (push) historyQ.push(question);
  addMsg(question, 'user');
  sendBtn.disabled = true;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question,
        category: catSel.value,
        group_type: grpSel.value,
        ui_lang: uiLang
      })
    });
    const data = await r.json();

    // 问答结果回写选择栏（自动识别联动；用户手动选择仍保留，未识别时不覆盖）
    if (data.category) catSel.value = data.category;
    if (data.group_type) grpSel.value = data.group_type;

    const meta = data.recognize ? (ui().recognize + data.recognize) : '';
    const botDiv = addMsg(data.answer || '（无结果）', 'bot', meta);
    renderSupplements(botDiv, data.supplements);

    (data.followups || []).forEach(f => {
      const b = document.createElement('div');
      b.className = 'msg bot follow'; b.style.fontSize = '13px'; b.style.color = '#0ea5e9'; b.style.marginTop = '6px';
      b.textContent = '💡 ' + f;
      b.onclick = () => ask(f);
      chat.appendChild(b);
    });
    chat.scrollTop = chat.scrollHeight;
  } catch (e) {
    addMsg('网络错误：' + e.message, 'bot');
  } finally {
    sendBtn.disabled = false;
    if (!regenerating) qInput.value = '';
  }
}

// ---- 语言切换：按新按钮语言重新生成历史全部回答 ----
async function regenerateAll() {
  regenerating = true;
  chat.innerHTML = '';
  addMsg(ui().welcome, 'bot');
  for (const q of historyQ) {
    await ask(q, { push: false });
  }
  regenerating = false;
}

function setLang(lang) {
  if (!['zh', 'ko', 'en'].includes(lang) || lang === uiLang) return;
  uiLang = lang;
  localStorage.setItem('busan-lang', lang);
  applyLangUI();
  regenerateAll();
}

langBtns.forEach(b => b.onclick = () => setLang(b.dataset.lang));

applyLangUI();

sendBtn.onclick = () => { const q = qInput.value.trim(); if (q) ask(q); };
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') { const q = qInput.value.trim(); if (q) ask(q); } });

// ---- GPS：定位附近景点 ----
function renderNearby(spots) {
  nearbyList.innerHTML = '';
  spots.forEach(s => {
    const card = document.createElement('div');
    card.className = 'nearby-card';
    card.innerHTML = `
      <div class="row1">
        <div>
          <div class="name">${s.name}</div>
          <div class="ko">${s.ko}</div>
          <div class="cat">${s.cat_label || ''}</div>
        </div>
        <div class="dist">${s.distance_km} km</div>
      </div>
      <div class="row2">
        <a class="nav-chat" href="javascript:void(0)">💬 问介绍</a>
        <a class="nav-naver" href="${s.naver_url}" target="_blank" rel="noopener">🗺 Naver 导航</a>
        <a class="nav-gmap" href="${s.google_url}" target="_blank" rel="noopener">📍 Google</a>
      </div>`;
    card.querySelector('.nav-chat').onclick = () => { catSel.value = s.cat || ''; ask(s.name + ' ' + ui().askIntro); };
    nearbyList.appendChild(card);
  });
  nearbyBox.style.display = 'block';
  nearbyBox.scrollIntoView({behavior: 'smooth'});
}

async function loadNearby(lat, lng) {
  setLoc(`定位成功：${lat.toFixed(4)}, ${lng.toFixed(4)}`);
  const r = await fetch('/api/nearby', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({lat, lng})
  });
  const data = await r.json();
  renderNearby(data.spots || []);
}

gpsBtn.onclick = () => {
  if (!navigator.geolocation) { alert('当前浏览器不支持定位'); return; }
  gpsBtn.classList.add('busy');
  gpsBtn.textContent = '定位中...';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    lastLat = pos.coords.latitude; lastLng = pos.coords.longitude;
    try { await loadNearby(lastLat, lastLng); }
    catch (e) { alert('获取附近景点失败：' + e.message); }
    finally { gpsBtn.classList.remove('busy'); gpsBtn.textContent = '📍 定位附近景点'; }
  }, (err) => {
    gpsBtn.classList.remove('busy');
    gpsBtn.textContent = '📍 定位附近景点';
    let msg = '定位失败：' + err.message;
    if (err.code === 1) msg += '\n\n权限被拒绝。请在浏览器设置中允许位置权限。';
    if (err.code === 3) msg += '\n\n超时。请走到开阔处再试。';
    if (location.protocol === 'http:' && location.hostname !== 'localhost') {
      msg += '\n\n提示：当前是 HTTP 局域网地址，部分浏览器会禁用定位。请用 HTTPS 或 localhost 访问，或直接点景点下方「Naver 导航」手动选点。';
    }
    alert(msg);
  }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 60000});
};
</script>
</body>
</html>
